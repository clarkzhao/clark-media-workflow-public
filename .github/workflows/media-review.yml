name: Media revision checks

on:
  push:
    paths:
      - 'scripts/media_review.py'
      - 'scripts/motion_probe.py'
      - 'tests/**'
      - 'examples/media_review/**'
      - 'requirements-motion-review.txt'
      - 'skills/**'
      - '.github/workflows/media-review.yml'
  pull_request:
    paths:
      - 'scripts/media_review.py'
      - 'scripts/motion_probe.py'
      - 'tests/**'
      - 'examples/media_review/**'
      - 'requirements-motion-review.txt'
      - 'skills/**'
      - '.github/workflows/media-review.yml'

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_media_review.py -v
      - run: python examples/media_review/demo.py --out outputs/ci-demo
  encoded-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --only-binary=:all: -r requirements-motion-review.txt
      - run: python -c "import av, cv2, numpy"
      - run: python -m unittest discover -s tests -p test_motion_probe.py -v
